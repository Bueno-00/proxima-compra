[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "proxima-compra"
version = "0.1.0"
description = "Recomendação da próxima compra com histórico de compras, visualizações e buscas (Diginetica, CIKM Cup 2016)"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["duckdb>=1.0", "numpy>=1.26", "scipy>=1.11", "pandas>=2.0", "pyarrow>=14", "lightgbm>=4.0", "torch>=2.2"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
pc = "proxima_compra.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
